name: Aggiorna prezzi Piccolo

on:
  workflow_dispatch:
  push:
    paths:
      - "fix_zero_quantity.py"
  schedule:
    - cron: "30 4 * * *"
    - cron: "30 5 * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica orario Europe Rome
        id: gate
        shell: python
        run: |
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          should_run = event in {"workflow_dispatch", "push"}

          if event == "schedule":
              now_rome = datetime.now(ZoneInfo("Europe/Rome"))
              should_run = now_rome.strftime("%H:%M") == "06:30"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")

          print("Esecuzione:", should_run)

      - name: Scarica repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Installa Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Applica fix quantità zero
        if: steps.gate.outputs.should_run == 'true'
        run: python fix_zero_quantity.py

      - name: Installa dipendenze
        if: steps.gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Test parser
        if: steps.gate.outputs.should_run == 'true'
        run: python test_parser.py

      - name: Aggiorna prezzi
        if: steps.gate.outputs.should_run == 'true'
        run: python updater.py

      - name: Ricertifica snapshot
        if: steps.gate.outputs.should_run == 'true'
        run: python recertify_db.py

      - name: Audit database
        if: steps.gate.outputs.should_run == 'true'
        run: python audit_db.py

      - name: Salva database e audit
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add updater.py test_parser.py prezzi.db audit_piccolo.json
          git diff --cached --quiet || git commit -m "Corregge quantità zero e aggiorna Piccolo"
          git push
