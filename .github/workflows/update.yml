name: Aggiorna prezzi Piccolo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Test parser
        run: python test_parser.py

      - name: Aggiorna prezzi
        run: python updater.py

      - name: Salva database aggiornato
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add prezzi.db
          git diff --cached --quiet || git commit -m "Aggiornamento automatico prezzi Piccolo"
          git push
